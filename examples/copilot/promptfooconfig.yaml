prompts: ["{{task}}"]
providers:
  - id: package:oh-my-promptfoo:CopilotSdkProvider
    config:
      working_dir: "{{env.COPILOT_WORKING_DIR}}"
      permissions:
        filesystem: write
        shell: deny
        network: deny
      env:
        COPILOT_GITHUB_TOKEN: "{{env.COPILOT_GITHUB_TOKEN}}"
tests:
  - vars:
      task: Explain the purpose of this repository.
    assert:
      - type: regex
        value: .+
