name: Publish
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Stable release tag to publish (v1.0.0)
        required: true
        type: string
concurrency:
  group: publish-${{ inputs.ref }}
  cancel-in-progress: false
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate checked stable tag
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const ref = process.env.RELEASE_REF;
          const match = /^v(\d+\.\d+\.\d+)$/.exec(ref);
          if (!match) throw Error('Expected a stable v<version> tag');
          const manifest = JSON.parse(readFileSync('packages/oh-my-promptfoo/package.json', 'utf8'));
          const root = JSON.parse(readFileSync('package.json', 'utf8'));
          if (root.version !== manifest.version) throw Error('Root and package versions differ');
          if (manifest.version !== match[1]) throw Error('Release tag does not match package version');
          const tags = execFileSync('git', ['tag', '--points-at', 'HEAD'], { encoding: 'utf8' }).split(/\r?\n/);
          if (!tags.includes(ref)) throw Error('Requested release tag does not point at checked-out HEAD');
          const tagRef = `refs/tags/${ref}`;
          const remote = execFileSync('git', ['ls-remote', 'origin', tagRef, `${tagRef}^{}`], { encoding: 'utf8' });
          const refs = new Map(remote.trim().split('\n').filter(Boolean).map(line => {
            const [hash, name] = line.split('\t');
            return [name, hash];
          }));
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if ((refs.get(`${tagRef}^{}`) ?? refs.get(tagRef)) !== head)
            throw Error('Release tag on origin does not point at checked-out HEAD');
          execFileSync('git', ['fetch', '--no-tags', 'origin', 'main'], { stdio: 'pipe' });
          try {
            execFileSync('git', ['merge-base', '--is-ancestor', 'HEAD', 'FETCH_HEAD'], { stdio: 'pipe' });
          } catch {
            throw Error('Release tag commit must be merged into main');
          }
          JS
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.6.2
      - run: bun install --frozen-lockfile
      - name: Validate source and packed package
        run: bun run typecheck && bun run lint && bun test && bun run build && bun run pack:check && bun run e2e
      - name: Preserve packed-package E2E evidence
        run: |
          mkdir -p release-evidence
          cp docs/evidence/promptfoo-e2e.json release-evidence/local-promptfoo-e2e.json
      - name: Publish stable under latest
        id: publish
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: bun scripts/publish.ts
      - name: Verify published registry consumers and Promptfoo E2E
        env:
          PUBLISHED_VERSION: ${{ steps.publish.outputs.version }}
        run: |
          bun scripts/smoke-packed-package.ts --registry "$PUBLISHED_VERSION"
          bun scripts/e2e.ts --registry "$PUBLISHED_VERSION"
          cp docs/evidence/promptfoo-e2e.json release-evidence/published-promptfoo-e2e.json
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync, spawnSync } from 'node:child_process';
          const ref = process.env.RELEASE_REF;
          const tagRef = `refs/tags/${ref}`;
          const remote = execFileSync('git', ['ls-remote', 'origin', tagRef, `${tagRef}^{}`], { encoding: 'utf8' });
          const refs = new Map(remote.trim().split('\n').filter(Boolean).map(line => {
            const [hash, name] = line.split('\t');
            return [name, hash];
          }));
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if ((refs.get(`${tagRef}^{}`) ?? refs.get(tagRef)) !== head)
            throw Error('Release tag moved on origin after publication');
          const view = spawnSync('gh', ['release', 'view', ref, '--json', 'isDraft,isPrerelease,tagName'], { encoding: 'utf8' });
          if (view.error) throw view.error;
          if (view.status !== 0) {
            if (!/release not found|HTTP 404\b/i.test(view.stderr)) throw Error(`gh release view failed: ${view.stderr}`);
            execFileSync('gh', ['release', 'create', ref, '--verify-tag', '--target', head, '--generate-notes'], { stdio: 'inherit' });
          } else {
            const release = JSON.parse(view.stdout);
            if (release.tagName !== ref) throw Error('Existing release has a different tag');
            if (release.isDraft) {
              execFileSync('gh', ['release', 'edit', ref, '--draft=false', '--prerelease=false'], { stdio: 'inherit' });
            } else if (release.isPrerelease) {
              throw Error('Existing release has the wrong prerelease status');
            }
          }
          JS
      - name: Upload release validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            docs/evidence/*.json
            release-evidence/
