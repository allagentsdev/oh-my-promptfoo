name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm distribution tag
        type: choice
        options: [next, latest]
        required: true
defaults:
  run:
    shell: bash
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.6.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run lint && bun test && bun run build && bun run pack:check && bun run e2e
      - name: Preserve local built E2E evidence
        run: |
          mkdir -p release-evidence
          cp docs/evidence/promptfoo-e2e.json release-evidence/local-promptfoo-e2e.json
      - name: Resolve matching prerelease candidate before stable release
        if: inputs.tag == 'latest'
        id: candidate
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('packages/promptfoo-integration/package.json', 'utf8'));
          const version = execFileSync('npm', ['view', `${manifest.name}@next`, 'version'], { encoding: 'utf8' }).trim();
          const prefix = `${manifest.version}-rc.`;
          if (!version.startsWith(prefix) || !/^[1-9]\d*$/.test(version.slice(prefix.length)))
            throw new Error('The next tag must identify a prerelease of the current stable version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - name: Verify candidate registry consumers
        if: inputs.tag == 'latest'
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        run: bun scripts/smoke-packed-package.ts --registry "$CANDIDATE_VERSION"
      - name: Run candidate registry Promptfoo E2E
        if: inputs.tag == 'latest'
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          bun scripts/e2e.ts --registry "$CANDIDATE_VERSION" | tee release-evidence/candidate-e2e.log
          cp docs/evidence/promptfoo-e2e.json release-evidence/candidate-promptfoo-e2e.json
      - name: Publish selected distribution tag
        id: publish
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bun scripts/publish.ts "$RELEASE_TAG"
      - name: Verify registry consumers with and without Copilot SDK
        env:
          PUBLISHED_VERSION: ${{ steps.publish.outputs.version }}
        run: bun scripts/smoke-packed-package.ts --registry "$PUBLISHED_VERSION"
      - name: Run built Promptfoo E2E against published registry version
        env:
          PUBLISHED_VERSION: ${{ steps.publish.outputs.version }}
        run: |
          bun scripts/e2e.ts --registry "$PUBLISHED_VERSION" | tee release-evidence/published-e2e.log
          cp docs/evidence/promptfoo-e2e.json release-evidence/published-promptfoo-e2e.json
      - name: Upload release validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_number }}-${{ inputs.tag }}
          path: |
            docs/evidence/*.json
            release-evidence/
