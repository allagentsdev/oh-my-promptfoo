name: Dependency Audit

on:
  schedule:
    - cron: "17 8 * * *"
  pull_request:
    branches: [main]
    paths:
      - package.json
      - '**/package.json'
      - bun.lock
      - .github/dependabot.yml
      - .github/workflows/dependency-audit.yml
      - tests/dependency-security.test.ts
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun audit --audit-level=moderate
      - name: Install reviewed dependencies without scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify pinned Forge rejects malformed signatures
        run: bun test tests/dependency-security.test.ts
