name: Dependency Audit

on:
  schedule:
    - cron: "17 8 * * *"
  pull_request:
    branches: [main]
    paths:
      - package.json
      - '**/package.json'
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/dependabot.yml
      - .github/workflows/dependency-audit.yml
      - tests/dependency-security.test.ts
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm audit --audit-level moderate
      - name: Install reviewed dependencies without scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify pinned Forge rejects malformed signatures
        run: pnpm test tests/dependency-security.test.ts
