name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack:check
  # Runs beside `validate`: it installs the packed package and stock Promptfoo into a
  # clean folder, so its time is mostly npm downloads, which the cache below reuses.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          # The e2e script pins the Promptfoo and Pi versions it installs.
          key: npm-e2e-${{ runner.os }}-${{ hashFiles('scripts/e2e.ts') }}
          restore-keys: npm-e2e-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm e2e
  linux-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install bounded HTTPS Git helper
        run: |
          sudo install -D -o root -g root -m 0755 scripts/workspace-helper.py /usr/local/libexec/allagents-workspace-helper
      - name: Install pinned ORAS
        run: |
          mkdir -p "$RUNNER_TEMP/oras"
          cd "$RUNNER_TEMP/oras"
          curl -fsSLO https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz
          curl -fsSLO https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_checksums.txt
          sha256sum --check --ignore-missing oras_1.3.0_checksums.txt
          tar -xzf oras_1.3.0_linux_amd64.tar.gz
      - name: Exercise real HTTPS Git and disposable OCI registry
        env:
          ALLAGENTS_TEST_GIT_HTTPS: '1'
          ALLAGENTS_TEST_ORAS_PATH: ${{ runner.temp }}/oras/oras
        run: pnpm test tests/sources.test.ts tests/sources-git-https.test.ts tests/sources-oci-registry.test.ts tests/workspace.test.ts
