name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release-please
  cancel-in-progress: false
permissions: {}
jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for the current version to be released
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          const root = JSON.parse(readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('packages/promptfoo-integration/package.json', 'utf8'));
          if (root.version !== manifest.version) throw Error('Root and public package versions differ');
          const result = spawnSync('npm', ['view', `${manifest.name}@${manifest.version}`, 'version', '--json', '--registry=https://registry.npmjs.org'], { encoding: 'utf8' });
          if (result.status !== 0) {
            if (!/\bE404\b/.test(result.stderr)) throw Error(`npm view failed (${result.status}): ${result.stderr}`);
            console.log(`${manifest.name}@${manifest.version} has not been published yet`);
            process.exit(0);
          }
          if (JSON.parse(result.stdout) !== manifest.version) throw Error('Unexpected registry version');
          const release = spawnSync('gh', ['release', 'view', `v${manifest.version}`, '--json', 'isDraft', '--jq', '.isDraft'], { encoding: 'utf8' });
          if (release.status !== 0 || release.stdout.trim() !== 'false') throw Error('Current version needs a published GitHub release');
          appendFileSync(process.env.GITHUB_OUTPUT, 'ready=true\n');
          JS
      - name: Ensure Release Please labels
        if: steps.current.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          for label in 'autorelease: pending' 'autorelease: tagged'; do
            if ! gh label list --limit 1000 --json name --jq '.[].name' | grep -Fxq "$label"; then
              gh label create "$label" --color 'ededed'
            fi
          done
      - name: Finalize the previously published release PR
        if: steps.current.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('packages/promptfoo-integration/package.json', 'utf8'));
          const prs = JSON.parse(execFileSync('gh', ['pr', 'list', '--state', 'merged', '--label', 'autorelease: pending', '--json', 'number,title', '--limit', '100'], { encoding: 'utf8' }));
          const matches = prs.filter(pr => pr.title === `chore(release): release ${version}`);
          if (matches.length > 1) throw Error('Ambiguous merged release pull request');
          if (matches.length === 1) {
            execFileSync('gh', ['pr', 'edit', String(matches[0].number), '--remove-label', 'autorelease: pending', '--add-label', 'autorelease: tagged'], { stdio: 'inherit' });
          }
          JS
      - name: Hold an existing release PR during updates
        if: steps.current.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          pr=$(gh pr list --state open --base main --label 'autorelease: pending' --json number,headRefName --jq '[.[] | select(.headRefName == "release-please--branches--main--components--promptfoo-integration")][0].number')
          if [ -n "$pr" ] && [ "$pr" != null ] && [ "$(gh pr view "$pr" --json isDraft --jq .isDraft)" = false ]; then
            gh pr ready "$pr" --undo
          fi
      - name: Prepare version and changelog pull request
        if: steps.current.outputs.ready == 'true'
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resolve pending release pull request
        if: steps.current.outputs.ready == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const reported = JSON.parse(process.env.RELEASE_PRS || '[]');
          if (reported.length > 1) throw Error('Expected at most one release pull request');
          const prs = JSON.parse(execFileSync('gh', ['pr', 'list', '--state', 'open', '--base', 'main', '--label', 'autorelease: pending', '--json', 'number,headRefName,headRepositoryOwner', '--limit', '100'], { encoding: 'utf8' }));
          const expected = 'release-please--branches--main--components--promptfoo-integration';
          const owner = process.env.GITHUB_REPOSITORY.split('/')[0];
          const matches = prs.filter(pr => pr.headRefName === expected && pr.headRepositoryOwner?.login === owner);
          if (matches.length > 1 || (reported.length && matches[0]?.number !== reported[0].number))
            throw Error('Ambiguous release pull request');
          if (matches.length) {
            appendFileSync(process.env.GITHUB_OUTPUT, `branch=${matches[0].headRefName}\nnumber=${matches[0].number}\n`);
          }
          JS
      - name: Preserve the trusted lock synchronizer
        if: steps.pr.outputs.branch != ''
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp scripts/sync-release-lock.ts "$RUNNER_TEMP/release-tools/sync-release-lock.ts"
          npm install --prefix "$RUNNER_TEMP/release-tools" --ignore-scripts --no-audit --no-fund --no-save jsonc-parser@3.3.1
      - uses: actions/checkout@v6
        if: steps.pr.outputs.branch != ''
        with:
          ref: ${{ steps.pr.outputs.branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        if: steps.pr.outputs.branch != ''
        with:
          bun-version: 1.4.0
      - name: Synchronize Bun lock in the release PR
        if: steps.pr.outputs.branch != ''
        id: lock
        run: |
          bun install --lockfile-only --ignore-scripts
          bun "$RUNNER_TEMP/release-tools/sync-release-lock.ts"
          if ! git diff --quiet -- package.json packages/promptfoo-integration/package.json; then
            echo 'Bun unexpectedly modified a package manifest' >&2
            exit 1
          fi
          if ! git diff --quiet -- bun.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bun.lock
            git commit -m 'chore: synchronize release lockfile'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Push synchronized lock and mark release PR ready
        if: steps.pr.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_BRANCH: ${{ steps.pr.outputs.branch }}
          RELEASE_PR: ${{ steps.pr.outputs.number }}
          LOCK_CHANGED: ${{ steps.lock.outputs.changed }}
        run: |
          if [ "$LOCK_CHANGED" = true ]; then
            gh auth setup-git
            git push origin "HEAD:$RELEASE_BRANCH"
          fi
          if [ "$(gh pr view "$RELEASE_PR" --json isDraft --jq .isDraft)" = true ]; then
            gh pr ready "$RELEASE_PR"
          fi
