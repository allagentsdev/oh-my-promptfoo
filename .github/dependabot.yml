version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      peer-sdks:
        patterns:
          - "@github/copilot-sdk"
          - "@earendil-works/pi-coding-agent"
          - "promptfoo"
      bundled-runtime:
        patterns:
          - "diff"
          - "ignore"
          - "import-meta-resolve"
          - "jsonc-parser"
      safe-tooling:
        patterns:
          - "@biomejs/*"
          - "@types/*"
          - "typescript"
          - "tsdown"
          - "rolldown"
          - "rolldown-plugin-dts"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    # The release-policy check distinguishes bundled/runtime and peer changes from
    # tooling even when the private root uses devDependencies. Rename runtime PRs
    # to fix(deps): ...; chore(deps-dev) does not trigger a Release Please release.
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Keep Node types aligned with the Node 22 runtime floor.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Etc/UTC
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
